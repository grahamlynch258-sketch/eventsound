[build]
  command = "npm run build"
  publish = "dist"

# Redirects and the 404/SPA fallbacks live in public/_redirects.

[build.environment]
  NODE_VERSION = "18"

# Netlify Image CDN may fetch and resize images from the site's Supabase
# storage (used as /.netlify/images?url=<storage url>&w=<width>).
[images]
  remote_images = ["https://blhxvtmhhvrorajkszhy\.supabase\.co/storage/v1/object/public/.*"]
