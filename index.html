    <!-- Self-hosted fonts — eliminates render-blocking Google Fonts requests -->
    <style>
      /* Stand-in fonts shown until Inter and Playfair Display arrive. Each is
         a font already on the device (Arial/Georgia on Windows, Mac and
         iPhone; Roboto/Noto Serif on Android), resized so its text takes up
         the same room as the real font. Without this the text re-wraps when
         the real font loads and the page jumps. The numbers come from
         evidence/fontmetrics.mjs in the handoff folder; re-run it if either
         web font file changes. They sit second in the font stacks in
         src/index.css and tailwind.config.ts. */
      @font-face { font-family: 'Inter Fallback Arial'; font-weight: 400; src: local('Arial'), local('ArialMT'); size-adjust: 106.38%; ascent-override: 91.18%; descent-override: 22.56%; line-gap-override: 0%; }
      @font-face { font-family: 'Inter Fallback Arial'; font-weight: 500; src: local('Arial'), local('ArialMT'); size-adjust: 107.29%; ascent-override: 90.41%; descent-override: 22.37%; line-gap-override: 0%; }

      @font-face { font-family: 'Inter Fallback Roboto'; font-weight: 600; src: local('Roboto Bold'), local('Roboto-Bold'); size-adjust: 107.81%; ascent-override: 89.97%; descent-override: 22.26%; line-gap-override: 0%; }
      @font-face { font-family: 'Inter Fallback Roboto'; font-weight: 700; src: local('Roboto Bold'), local('Roboto-Bold'); size-adjust: 108.7%; ascent-override: 89.24%; descent-override: 22.08%; line-gap-override: 0%; }

    <!-- Analytics bootstrap. External analytics load only on the production
         hostname and never for admin pages or staff-marked browsers. -->
    <script>
      (function () {
        var INTERNAL_KEY = "eventsound_internal_traffic";
        var params = new URLSearchParams(window.location.search);
        var internalFlag = params.get("eventsound_internal");

        try {
          if (internalFlag === "1") window.localStorage.setItem(INTERNAL_KEY, "true");
          if (internalFlag === "0") window.localStorage.removeItem(INTERNAL_KEY);
          if (internalFlag !== null) {
            params.delete("eventsound_internal");
            var cleanQuery = params.toString();
            window.history.replaceState({}, "", window.location.pathname + (cleanQuery ? "?" + cleanQuery : "") + window.location.hash);
          }
        } catch (_) {
          // Storage may be unavailable. Continue without a persistent staff marker.
        }

        var isInternal = false;
        try {
          isInternal = window.localStorage.getItem(INTERNAL_KEY) === "true";
        } catch (_) {}

        var isProduction = window.location.hostname === "eventsound.ie" || window.location.hostname === "www.eventsound.ie";
        var isAdmin = window.location.pathname === "/admin" || window.location.pathname.indexOf("/admin/") === 0;
        window.eventsoundAnalyticsEligible = isProduction && !isAdmin && !isInternal;

        if (!window.eventsoundAnalyticsEligible) return;

        // Queue calls immediately so nothing is lost; the scripts themselves
        // (~200 KB) load on the first interaction or shortly after the page
        // has finished loading, so they never compete with page content.
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", "AW-1014417298");
        window.clarity = window.clarity || function () { (window.clarity.q = window.clarity.q || []).push(arguments); };

        var analyticsLoaded = false;
        var interactionEvents = ["pointerdown", "keydown", "touchstart", "scroll"];
        function loadAnalytics() {
          if (analyticsLoaded) return;
          analyticsLoaded = true;
          interactionEvents.forEach(function (name) { window.removeEventListener(name, loadAnalytics); });

          var googleScript = document.createElement("script");
          googleScript.async = true;
          googleScript.src = "https://www.googletagmanager.com/gtag/js?id=AW-1014417298";
          document.head.appendChild(googleScript);

          var clarityScript = document.createElement("script");
          clarityScript.async = true;
          clarityScript.src = "https://www.clarity.ms/tag/" + "w8hac3nrqi";
          document.head.appendChild(clarityScript);
        }

        interactionEvents.forEach(function (name) { window.addEventListener(name, loadAnalytics, { passive: true }); });
        function afterPageLoad() { window.setTimeout(loadAnalytics, 2000); }
        if (document.readyState === "complete") afterPageLoad();
        else window.addEventListener("load", afterPageLoad, { once: true });
        // Safety net for pages whose load event is slow (many images).
        window.setTimeout(loadAnalytics, 8000);
      })();
    </script>
